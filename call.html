<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Call My AI — Vanwayne Chaney Jr.</title>
<meta name="description" content="Call Vanwayne Chaney Jr.'s AI at 216-616-1364. Ask it about him, or call in like a customer and let it book you.">
<meta name="robots" content="noindex">

<meta property="og:title" content="Call My AI">
<meta property="og:description" content="216-616-1364. Ask it about me, or call in like a customer and let it book you.">
<meta property="og:image" content="https://vanwaynechaney.com/og-live-demos.jpg">
<meta property="og:url" content="https://vanwaynechaney.com/call">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600&family=DM+Mono:wght@400&family=Inter:wght@400;600&display=swap" rel="stylesheet">

<style>
  :root{
    --bg:#0a0a0c; --card:#121216; --gold:#c9a84c;
    --text:#f4f2ee; --muted:#8d8a84; --border:rgba(255,255,255,.08);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding:1.5rem; text-align:center; line-height:1.5;
  }
  .wrap{max-width:420px;width:100%}
  .label{
    font-family:'DM Mono',monospace; font-size:.68rem; letter-spacing:.14em;
    text-transform:uppercase; color:var(--gold); margin-bottom:1rem;
  }
  h1{
    font-family:'Cormorant Garamond',serif; font-weight:600;
    font-size:clamp(2rem,9vw,2.8rem); line-height:1.1; margin-bottom:.75rem;
  }
  p.sub{color:var(--muted); font-size:.95rem; margin-bottom:2rem}
  .btn{
    display:block; width:100%; padding:1.1rem 1.5rem;
    background:var(--gold); color:#0a0a0c; text-decoration:none;
    font-weight:600; font-size:1.1rem; border-radius:12px;
    border:0; cursor:pointer; font-family:inherit;
  }
  .btn:active{transform:translateY(1px)}
  .num{
    display:block; margin-top:1.25rem; font-family:'DM Mono',monospace;
    font-size:1.35rem; color:var(--text); text-decoration:none; letter-spacing:.02em;
  }
  .note{margin-top:1.75rem; font-size:.8rem; color:var(--muted); opacity:.8}
  .back{
    display:inline-block; margin-top:2.5rem; font-size:.8rem;
    color:var(--muted); text-decoration:none; border-bottom:1px solid var(--border);
    padding-bottom:2px;
  }
  @media (prefers-reduced-motion:no-preference){
    .wrap{animation:in .4s ease-out both}
    @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
</style>
</head>
<body>
  <main class="wrap">
    <div class="label">VC2 AI · Cleveland</div>
    <h1>Call My AI</h1>
    <p class="sub" id="sub">Ask it about me, or call in like a customer and let it book you.</p>

    <a href="tel:+12166161364" class="btn" id="callBtn">Call now</a>
    <a href="tel:+12166161364" class="num">(216) 616-1364</a>

    <p class="note" id="note"></p>
    <a href="/live-demos" class="back">See what else I build</a>
  </main>

<script>
/* --------------------------------------------------------------------------
   /call — the short link. Say it out loud, put it on a card.
   Deliberately its own tiny page rather than a redirect into /live-demos:
   the handoff should happen on a page that has already finished loading, and
   live-demos is a full sales page.

   TOUCH  -> dials immediately on arrival. Wayne verified this fires on a real
             phone. The OS still shows its own "Call this number?" confirm --
             that is an iOS/Android anti-toll-fraud guarantee and no site can
             remove it.
   DESKTOP-> never auto-dials, because desktops cannot place calls. Shows the
             number to read off instead. This is why testing on a laptop always
             looks "broken" -- it is working as designed.
   -------------------------------------------------------------------------- */
(function () {
  var PHONE = '+12166161364';
  var isTouch = window.matchMedia &&
                window.matchMedia('(hover: none) and (pointer: coarse)').matches;
  var note = document.getElementById('note');

  if (!isTouch) {
    document.getElementById('sub').textContent =
      'Grab your phone and dial the number below — it answers on the first ring.';
    document.getElementById('callBtn').style.display = 'none';
    if (note) note.textContent = 'You are on a computer, so it cannot dial for you.';
    return;
  }

  if (note) note.textContent = 'Connecting… if it does not start, tap Call now.';
  setTimeout(function () { window.location.href = 'tel:' + PHONE; }, 350);
})();
</script>
</body>
</html>
